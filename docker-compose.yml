version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: agrilog-db
    restart: always
    environment:
      MYSQL_DATABASE: agrilog
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

  backend:
    build: ./backend
    container_name: agrilog-backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=
      - DB_NAME=agrilog
      - PORT=3000
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: agrilog-frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://backend:3000
    depends_on:
      - backend

volumes:
  mysql-data:
